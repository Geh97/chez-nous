<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chez nous</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Chez nous">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E9F1EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#191322" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E9F1EE; --paper:#FFFFFF; --raise:#F4F9F7; --ink:#2A1D3A; --muted:#695E77; --line:#D3DFD9;
  --shadow:0 1px 0 rgba(42,29,58,.05), 0 10px 22px -14px rgba(42,29,58,.45);
  --font:"Bricolage Grotesque", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand:"Caveat", "Bradley Hand", "Segoe Print", cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#191322; --paper:#251D31; --raise:#2E2540; --ink:#F3EEF8; --muted:#AA9EBA; --line:#3B304B;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 22px -14px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  --bg:#191322; --paper:#251D31; --raise:#2E2540; --ink:#F3EEF8; --muted:#AA9EBA; --line:#3B304B;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 22px -14px rgba(0,0,0,.9);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:8px}
h1,h2,h3,p{margin:0}

#app{max-width:520px;margin:0 auto;padding:18px 16px 120px}
.center{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:18px}

/* en-tête */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-size:2.1rem;font-weight:800;letter-spacing:-.03em;line-height:1}
.sub{color:var(--muted);font-size:.95rem;margin-top:4px}
.duo{display:flex}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;
  background:linear-gradient(135deg,var(--c) 50%,var(--c2,var(--c)) 50%);border:3px solid var(--bg)}
.duo .av + .av{margin-left:-10px}
.av.me{box-shadow:0 0 0 2px var(--ink)}
.av.sm{width:22px;height:22px;font-size:.7rem;border-width:0}

.banner{background:var(--paper);border:1.5px dashed var(--muted);border-radius:14px;padding:10px 12px;font-size:.9rem;margin-bottom:14px}

h2{font-size:1.25rem;font-weight:800;letter-spacing:-.01em}
.sec{margin-top:26px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.empty{color:var(--muted);background:var(--raise);border-radius:16px;padding:16px;font-size:.95rem}

/* notes sur le frigo */
.notes{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px;padding-top:8px}
.note{position:relative;background:color-mix(in srgb,var(--c) 24%,var(--paper));border-radius:4px 4px 14px 4px;
  padding:20px 12px 12px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;min-height:120px}
.note:nth-child(odd){transform:rotate(-1.3deg)}
.note:nth-child(even){transform:rotate(1.1deg)}
.note:nth-child(3n){transform:rotate(.4deg)}
.magnet{position:absolute;top:-8px;left:50%;margin-left:-9px;width:18px;height:18px;border-radius:50%;
  background:var(--c);box-shadow:inset -2px -3px 0 rgba(0,0,0,.18), 0 2px 3px rgba(0,0,0,.25)}
.note-text{font-family:var(--hand);font-size:1.45rem;line-height:1.1;font-weight:700;overflow-wrap:anywhere;flex:1}
.note.done .note-text{text-decoration:line-through;opacity:.6}
.note-meta{font-size:.78rem;color:var(--muted)}
.note-btn{align-self:flex-start;font-size:.85rem;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--paper)}

/* pastilles / filtres */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:999px;background:var(--paper);font-size:.88rem;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

/* lignes */
.list{display:flex;flex-direction:column;gap:8px}
.row{position:relative;overflow:hidden;display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:16px;padding:10px 12px 10px 18px}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(var(--c) 50%,var(--c2,var(--c)) 50%)}
.row-main{flex:1;text-align:left;min-width:0}
.row-t{font-weight:600;overflow-wrap:anywhere}
.row-m{font-size:.82rem;color:var(--muted);margin-top:1px}
.row.late .row-m{color:#C9304F;font-weight:600}
.row.dim .row-t{text-decoration:line-through;color:var(--muted)}
.time{font-weight:800;font-size:.9rem;min-width:46px}
.tick{flex:none;width:28px;height:28px;border-radius:50%;border:2.5px solid var(--c);display:grid;place-items:center;color:#fff}
.tick.on{background:var(--c)}
.tick.wait{border-style:dashed}
.acts{display:flex;gap:6px;flex:none}
.btn{padding:8px 12px;border-radius:999px;font-weight:600;font-size:.88rem;background:var(--raise)}
.btn.yes{background:var(--ink);color:var(--bg)}
.btn.big{width:100%;padding:14px;font-size:1rem;border-radius:16px}
.btn.duo-bg{background:linear-gradient(135deg,var(--c),var(--c2));color:#fff}
.link{color:var(--muted);font-weight:600;font-size:.9rem;text-decoration:underline;text-underline-offset:3px}
.danger{color:#C9304F}

/* agenda */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h h2{text-transform:capitalize}
.nav-m{width:38px;height:38px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;background:var(--paper);border-radius:20px;padding:10px 8px}
.dow{text-align:center;font-size:.75rem;color:var(--muted);font-weight:600;padding-bottom:4px}
.day{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-weight:600;font-size:.95rem}
.day.today{box-shadow:inset 0 0 0 2px var(--ink)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.dots{display:flex;gap:2px;height:6px}
.dot{width:6px;height:6px;border-radius:50%;background:linear-gradient(135deg,var(--c) 50%,var(--c2,var(--c)) 50%)}
.dot.hollow{background:none;box-shadow:inset 0 0 0 1.5px var(--c)}

/* barre du bas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--paper);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 64px 1fr 1fr;align-items:center}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:.72rem;font-weight:600;color:var(--muted)}
.tab[aria-current="page"]{color:var(--ink)}
.tab svg{width:24px;height:24px}
.badge{position:absolute;top:0;left:50%;margin-left:6px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#D93B72;color:#fff;font-size:.7rem;display:grid;place-items:center}
.plus{width:56px;height:56px;border-radius:50%;justify-self:center;margin-top:-26px;color:#fff;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--c) 50%,var(--c2) 50%);border:4px solid var(--paper);box-shadow:var(--shadow)}
.plus svg{width:26px;height:26px}

/* panneau */
.veil{position:fixed;inset:0;z-index:10;background:rgba(20,12,30,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:520px;max-height:88vh;max-height:88dvh;overflow:auto;background:var(--bg);border-radius:26px 26px 0 0;
  padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.note{transform:none!important}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.x{width:36px;height:36px;border-radius:50%;background:var(--paper);display:grid;place-items:center}
.f{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.f > span{font-size:.88rem;font-weight:600;color:var(--muted)}
.in{width:100%;background:var(--paper);border:2px solid transparent;border-radius:14px;padding:12px;font-size:16px;-webkit-appearance:none;appearance:none;min-height:48px}
.in:focus{outline:none;border-color:var(--ink)}
.in.bad{border-color:#C9304F}
textarea.in{resize:none;font-family:var(--hand);font-size:1.5rem;font-weight:700;line-height:1.15}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg-b{flex:1;white-space:nowrap;padding:10px 12px;border-radius:14px;background:var(--paper);font-weight:600;font-size:.92rem}
.seg-b[aria-pressed="true"]{background:linear-gradient(135deg,var(--c,var(--ink)),var(--c2,var(--c,var(--ink))));color:var(--on,var(--bg))}
.sw{width:40px;height:40px;border-radius:50%;background:var(--c)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 6px var(--c)}
.sw:disabled{opacity:.2;cursor:not-allowed}
.sws{display:flex;gap:12px;flex-wrap:wrap;padding:6px 3px}
.check{display:flex;align-items:center;gap:10px;background:var(--paper);border-radius:14px;padding:12px;font-weight:600}
.check input{width:22px;height:22px;accent-color:var(--ink)}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{background:var(--paper);border-radius:18px;padding:18px 12px;font-weight:800;text-align:left;font-size:1.05rem}
.menu small{display:block;font-weight:400;color:var(--muted);font-size:.82rem;margin-top:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));z-index:20;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;max-width:90%;text-align:center}
.who{display:flex;flex-direction:column;gap:12px}
.who button{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:20px;padding:16px;font-size:1.2rem;font-weight:800;text-align:left}
.who small{display:block;font-size:.88rem;font-weight:400;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<div id="app"><div class="center"><p class="brand">Chez nous</p><p class="sub">On ouvre la porte…</p></div></div>
<div id="sheet"></div>
<div id="toast"></div>
<script>
(() => {
"use strict";
const COLORS = [
  {id:"mandarine",hex:"#E86A1C"},{id:"framboise",hex:"#D93B72"},{id:"menthe",hex:"#0E9A82"},
  {id:"lagon",hex:"#2B78E4"},{id:"prune",hex:"#8452D6"},{id:"olive",hex:"#6E8F12"}
];
const CATS = {maison:"Maison", perso:"Perso", couple:"Couple"};
const RECS = {none:"Une fois", daily:"Chaque jour", weekly:"Chaque semaine", monthly:"Chaque mois"};
const COLLS = ["reminders","events","tasks"];
const CAP = {couple:2, famille:6};
const APP_URL = location.origin + location.pathname;
const GCAL_PREFIX = "https://calendar.google.com/calendar/ical/";

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y,m-1,d); };
const today = () => ymd(new Date());
const addDays = (s,n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
function nice(s){
  const t = today();
  if (s === t) return "aujourd'hui";
  if (s === addDays(t,1)) return "demain";
  if (s === addDays(t,-1)) return "hier";
  return parse(s).toLocaleDateString("fr-FR",{weekday:"short",day:"numeric",month:"short"});
}
function nextDue(s, rec){
  const t = today(); let d = parse(s || t);
  do {
    if (rec === "daily") d.setDate(d.getDate()+1);
    else if (rec === "weekly") d.setDate(d.getDate()+7);
    else d.setMonth(d.getMonth()+1);
  } while (ymd(d) < t);
  return ymd(d);
}
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const LOADING = `<div class="center"><p class="brand">Chez nous</p><p class="sub">On ouvre la porte…</p></div>`;

const S = {
  authed:false, uid:null, email:"", readOnly:false, failed:false, loaded:false,
  space:null, invites:[], pending:[], wantCreate:false, people:{}, me:null,
  reminders:[], events:[], tasks:[],
  tab:"frigo", noteView:"recus", month:new Date(new Date().getFullYear(), new Date().getMonth(), 1), day:today(),
  taskWho:"me", taskCat:"all", showDone:false, edit:null,
  gcal:[], gcalStatus:{}, gcalMine:false
};

/* ---------- données (Supabase) ---------- */
const SB_URL = "https://ahbfgjfzrmxwifzltnov.supabase.co";
const SB_KEY = "sb_publishable_5KRLBH1wIB3cNhmewY3u-g_jcu9OfNL";
let sb = null, channel = null;

function applyRow(coll, id, data){
  if (coll === "people") { if (data) S.people[id] = data; else delete S.people[id]; S.me = S.people[S.uid] ? S.uid : null; return; }
  if (COLLS.indexOf(coll) < 0) return;
  S[coll] = S[coll].filter(x => x.id !== id);
  if (data) S[coll].push(Object.assign({}, data, {id}));
}
function fail(){ if (!S.loaded) { S.failed = true; render(); } }
async function loadPending(){
  if (!S.space) return;
  const r = await sb.from("invites").select("email").eq("space_id", S.space.id).order("created_at");
  if (!r.error) S.pending = r.data.map(x => x.email);
}
async function loadAll(){
  const s = await sb.from("spaces").select("id,kind").maybeSingle();
  if (s.error) return fail();
  if (!s.data) {
    const i = await sb.rpc("my_invites");
    if (i.error) return fail();
    Object.assign(S, {space:null, people:{}, me:null, pending:[], invites:i.data || []});
    COLLS.forEach(c => S[c] = []);
  } else {
    const [r, p] = await Promise.all([
      sb.from("docs").select("coll,id,data").eq("space_id", s.data.id),
      sb.from("invites").select("email").eq("space_id", s.data.id).order("created_at")
    ]);
    if (r.error || p.error) return fail();
    Object.assign(S, {space:s.data, people:{}, me:null, invites:[], pending:p.data.map(x => x.email)});
    COLLS.forEach(c => S[c] = []);
    r.data.forEach(row => applyRow(row.coll, row.id, row.data));
  }
  S.loaded = true; render();
  if (S.space) loadGcal();
}
/* Google Agenda : événements en lecture seule, lus côté serveur (fonction gcal) */
async function loadGcal(){
  const r = await sb.functions.invoke("gcal", {method:"POST"});
  if (r.error || !r.data || !r.data.events) return;
  const hm = d => `${pad(d.getHours())}:${pad(d.getMinutes())}`;
  S.gcalStatus = r.data.status || {};
  S.gcal = r.data.events.map(g => {
    const base = {id:"g:"+g.id, kind:"gcal", who:g.owner, title:g.title};
    if (g.allDay) return Object.assign(base, {date:g.date, allDay:true, start:null, end:null});
    const s = new Date(g.start), e = new Date(g.end);
    return Object.assign(base, {date:ymd(s), allDay:false, start:hm(s), end:ymd(e) === ymd(s) ? hm(e) : null});
  });
  render();
}
async function loadGcalMine(){
  const r = await sb.from("calendar_feeds").select("user_id").eq("user_id", S.uid).maybeSingle();
  if (!r.error) S.gcalMine = !!r.data;
}
const allEvents = () => S.events.concat(S.gcal.filter(g => S.people[g.who]));
function live(){
  if (channel) { sb.removeChannel(channel); channel = null; }
  if (!S.space) return;
  channel = sb.channel("docs-" + S.space.id).on("postgres_changes", {event:"*", schema:"public", table:"docs"}, p => {
    const row = p.eventType === "DELETE" ? p.old : p.new;
    if (!S.space || !row || row.space_id !== S.space.id) return;
    applyRow(row.coll, row.id, p.eventType === "DELETE" ? null : row.data);
    render();
  }).subscribe();
}
async function enter(session){
  if (S.authed && S.uid === session.user.id) return;
  S.uid = session.user.id; S.email = (session.user.email || "").toLowerCase();
  S.authed = true; S.loaded = false; S.wantCreate = false;
  $("#app").dataset.screen = ""; $("#app").innerHTML = LOADING;
  await loadAll(); live();
}
function leave(){
  if (channel) { sb.removeChannel(channel); channel = null; }
  Object.assign(S, {authed:false, uid:null, email:"", me:null, space:null, people:{}, invites:[], pending:[], loaded:false, wantCreate:false, reminders:[], events:[], tasks:[], gcal:[], gcalStatus:{}, gcalMine:false});
  render();
}
function writeErr(){ toast("Ça n'a pas été enregistré. Vérifie ta connexion."); loadAll(); }
const store = {
  async init(){
    if (!window.supabase) { S.failed = true; return render(); }
    sb = window.supabase.createClient(SB_URL, SB_KEY);
    sb.auth.onAuthStateChange((evt, session) => { setTimeout(() => { if (session) enter(session); else leave(); }, 0); });
    document.addEventListener("visibilitychange", () => { if (!document.hidden && S.authed && S.loaded) loadAll(); });
  },
  async put(c, item){
    const id = item.id || newId(); const data = Object.assign({}, item); delete data.id;
    applyRow(c, id, data); render();
    const r = await sb.from("docs").upsert({space_id:S.space.id, coll:c, id, data, updated_at:new Date().toISOString()});
    if (r.error) { writeErr(); return false; } return true;
  },
  async del(c, id){
    applyRow(c, id, null); render();
    const r = await sb.from("docs").delete().eq("space_id", S.space.id).eq("coll", c).eq("id", id);
    if (r.error) { writeErr(); return false; } return true;
  }
};

/* ---------- personnes ---------- */
const couple = () => !S.space || S.space.kind === "couple";
const P = k => S.people[k] || {name:"?", color:"mandarine"};
const ids = () => Object.keys(S.people).sort((a,b) => (S.people[a].joinedAt||0) - (S.people[b].joinedAt||0));
const others = () => ids().filter(k => k !== S.me);
const pName = () => { const o = couple() && others()[0]; return o ? P(o).name : null; };   // prénom de l'autre, en couple
const hex = k => (COLORS.find(c => c.id === P(k).color) || COLORS[0]).hex;
const bothHex = () => { const l = ids(), a = l[0] ? hex(l[0]) : COLORS[0].hex; return [a, l[1] ? hex(l[1]) : a]; };
const cv = who => { if (who === "both") { const [a,b] = bothHex(); return `--c:${a};--c2:${b}`; } return `--c:${hex(who)};--c2:${hex(who)}`; };
const ALL = () => couple() ? "Nous deux" : "Tout le monde";
const MOMENT = () => couple() ? "moment à deux" : "moment en famille";
const nm = who => who === "both" ? ALL() : (who === S.me ? "Moi" : esc(P(who).name));
const nmFull = who => who === "both" ? ALL().toLowerCase() : esc(P(who).name);
const av = (k, cls) => `<span class="av ${cls||""}" style="${cv(k)}">${esc((P(k).name||"?").charAt(0).toUpperCase())}</span>`;
const freeColor = taken => (COLORS.find(c => taken.indexOf(c.id) < 0) || COLORS[0]).id;

/* ---------- icônes ---------- */
const I = {
  frigo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="2.5" width="14" height="19" rx="3"/><path d="M5 10h14M9 6v1.5M9 13.5v3"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16.5 9.5"/></svg>',
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.4a4.3 4.3 0 0 1 7.5 2.4C19.5 15.4 12 20 12 20z"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  ok:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  left:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  x:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

/* ---------- sélections utiles ---------- */
const mineT = t => t.assignee === S.me || t.assignee === "both";
const evKey = e => e.allDay || !e.start ? "00:00" : e.start;
const evVisible = e => !(e.kind === "couple" && e.status === "declined");
const evTime = e => e.allDay || !e.start ? "Journée" : esc(e.start);
const toAnswer = () => S.events.filter(e => e.kind === "couple" && e.status === "proposed" && e.by !== S.me);
const toValidate = () => S.tasks.filter(t => t.status === "pending" && t.doneBy !== S.me);
const lateMine = () => S.tasks.filter(t => t.status === "todo" && mineT(t) && t.due && t.due < today());
const notesForMe = () => S.reminders.filter(r => r.to === S.me && !r.done);

/* ---------- rendu ---------- */
function render(){
  const app = $("#app");
  if (S.failed) { app.dataset.screen = "err"; app.innerHTML = `<div class="center"><p class="brand">Chez nous</p><p class="sub">Impossible de joindre le serveur. Vérifie ta connexion et recharge la page.</p></div>`; return; }
  if (!S.authed) { if (app.dataset.screen !== "login") { app.dataset.screen = "login"; app.innerHTML = vLogin(); } return; }
  if (!S.loaded) return;
  if (!S.space) {
    const scr = S.invites.length && !S.wantCreate ? "invited" : "create";
    app.dataset.screen = scr; app.innerHTML = scr === "invited" ? vInvited() : vCreate(); return;
  }
  if (!S.me) { if (app.dataset.screen !== "profile") { app.dataset.screen = "profile"; app.innerHTML = vProfile(); } return; }
  app.dataset.screen = "main";
  const views = {frigo:vFrigo, agenda:vAgenda, taches:vTaches, deux:vDeux};
  const d = new Date().toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  const b = {frigo:notesForMe().length, deux:toAnswer().length, taches:toValidate().length + lateMine().length};
  const tab = (id,label,icon) => `<button class="tab" data-act="tab" data-tab="${id}" ${S.tab===id?'aria-current="page"':""}>${icon}<span>${label}</span>${b[id]?`<span class="badge">${b[id]}</span>`:""}</button>`;
  app.innerHTML = `
    <header class="top">
      <div><h1 class="brand">Chez nous</h1><p class="sub">${esc(d)}</p></div>
      <button class="duo" data-act="settings" aria-label="Réglages">${av(S.me,"me")}${others().map(k => av(k)).join("")}</button>
    </header>
    ${S.readOnly ? `<p class="banner">Tu es en lecture seule. Demande à être invité(e) comme éditeur pour ajouter des choses.</p>` : ""}
    ${others().length ? "" : vAlone()}
    <main>${views[S.tab]()}</main>
    <nav class="tabs"><div class="tabs-in">
      ${tab("frigo","Frigo",I.frigo)}${tab("agenda","Agenda",I.cal)}
      <button class="plus" style="${cv("both")}" data-act="add" aria-label="Ajouter">${I.plus}</button>
      ${tab("taches","Tâches",I.check)}${tab("deux",couple() ? "À deux" : "Ensemble",I.heart)}
    </div></nav>`;
}

function vAlone(){
  if (S.pending.length) return `<div class="banner">Invitation envoyée à <b>${esc(S.pending.join(", "))}</b>. Il ne reste qu'à créer un compte avec cette adresse sur l'appli. <button class="link" data-act="settings">Gérer</button></div>`;
  return `<div class="banner">Tu es seul(e) dans votre espace pour l'instant. <button class="link" data-act="invite">Inviter ${couple() ? "ta moitié" : "ta famille"}</button></div>`;
}
function swatches(group, cur, taken){
  taken = taken || [];
  return `<div class="sws">${COLORS.map(c => `<button type="button" class="sw" data-seg="${group}" data-val="${c.id}" aria-pressed="${c.id===cur}" aria-label="${c.id}" style="--c:${c.hex}" ${taken.indexOf(c.id)>=0 && c.id!==cur ? "disabled" : ""}></button>`).join("")}</div>`;
}
function vLogin(){
  return `<div class="center">
    <div><h1 class="brand">Chez nous</h1><p class="sub">Connecte-toi pour retrouver votre espace.</p></div>
    <div>
      <label class="f"><span>E-mail</span><input class="in" id="l-email" type="email" autocomplete="email" autocapitalize="none" inputmode="email"></label>
      <label class="f"><span>Mot de passe</span><input class="in" id="l-pw" type="password" autocomplete="current-password"></label>
      <button class="btn yes big" data-act="login">Se connecter</button>
      <p style="text-align:center;margin-top:14px"><button class="link" data-act="signup">Créer mon compte avec cet e-mail</button></p>
    </div></div>`;
}
const logoutLink = `<p style="text-align:center"><button class="link" data-act="logout">Se déconnecter</button></p>`;
function vCreate(){
  return `<div class="center">
    <div><h1 class="brand">Chez nous</h1><p class="sub">Bienvenue. Cet espace, c'est pour…</p></div>
    <div class="who">
      <button data-act="create" data-kind="couple"><span>Notre couple<small>Deux personnes : rappels, agenda, tâches, moments à deux</small></span></button>
      <button data-act="create" data-kind="famille"><span>Notre famille<small>Jusqu'à six personnes, une couleur chacun</small></span></button>
    </div>
    ${S.invites.length ? `<p style="text-align:center"><button class="link" data-act="see-invites">Voir mon invitation</button></p>` : ""}
    ${logoutLink}</div>`;
}
function vInvited(){
  return `<div class="center">
    <div><h1 class="brand">Chez nous</h1><p class="sub">Tu as été invité(e) à rejoindre un espace.</p></div>
    <div class="who">${S.invites.map(i => `<button data-act="join" data-sid="${esc(i.space_id)}"><span>Rejoindre ${esc(i.from_name)}<small>${i.kind === "couple" ? "Espace de couple" : "Espace de famille"}</small></span></button>`).join("")}</div>
    <p style="text-align:center"><button class="link" data-act="want-create">Créer plutôt mon propre espace</button></p>
    ${logoutLink}</div>`;
}
function vProfile(){
  const taken = others().map(k => P(k).color);
  return `<div class="center">
    <div><h1 class="brand">Chez nous</h1><p class="sub">Un prénom, une couleur, et c'est parti.</p></div>
    <div>
      <label class="f"><span>Ton prénom</span><input class="in" id="s-n1" autocomplete="given-name" maxlength="20"></label>
      <div class="f"><span>Ta couleur</span>${swatches("s-c1", freeColor(taken), taken)}</div>
      <button class="btn yes big" data-act="profile-save">C'est parti</button>
    </div></div>`;
}

function evRow(e, withDate){
  if (e.kind === "gcal") return `<div class="row" style="${cv(e.who)}">
    <span class="time">${withDate ? esc(nice(e.date)) : evTime(e)}</span>
    <div class="row-main"><div class="row-t">${esc(e.title)}</div>
      <div class="row-m">${withDate ? evTime(e)+", " : ""}${nmFull(e.who)}, Google Agenda${e.end && !e.allDay ? `, jusqu'à ${esc(e.end)}` : ""}</div></div></div>`;
  const prop = e.kind === "couple" && e.status === "proposed";
  return `<div class="row" style="${cv(e.who)}">
    <span class="time">${withDate ? esc(nice(e.date)) : evTime(e)}</span>
    <button class="row-main" data-act="${e.kind==="couple"?"deux-edit":"ev-edit"}" data-id="${e.id}">
      <div class="row-t">${esc(e.title)}</div>
      <div class="row-m">${withDate ? evTime(e)+", " : ""}${e.kind==="couple" ? (prop ? MOMENT()+", en attente" : MOMENT()) : nmFull(e.who)}${e.end && !e.allDay ? `, jusqu'à ${esc(e.end)}` : ""}</div>
    </button></div>`;
}
function taskRow(t){
  const tdy = today(), late = t.status === "todo" && t.due && t.due < tdy, pn = pName();
  const meta = [CATS[t.category] || "Maison"];
  if (t.assignee !== S.me) meta.unshift(nmFull(t.assignee));
  if (t.due) meta.push((late ? "en retard, " : "") + nice(t.due));
  if (t.recurrence && t.recurrence !== "none") meta.push(RECS[t.recurrence].toLowerCase());
  if (t.status === "pending") meta.push(t.doneBy === S.me ? (pn ? `en attente de ${esc(pn)}` : "en attente de validation") : `fait par ${nmFull(t.doneBy)}`);
  const toVal = t.status === "pending" && t.doneBy !== S.me;
  const cls = t.status === "done" ? "on" : t.status === "pending" ? "wait" : "";
  return `<div class="row ${late?"late":""} ${t.status==="done"?"dim":""}" style="${cv(t.assignee)}">
    ${toVal ? "" : `<button class="tick ${cls}" style="--c:${t.assignee==="both"?"var(--ink)":hex(t.assignee)}" data-act="task-tick" data-id="${t.id}" aria-label="Cocher">${t.status==="done"?I.ok:""}</button>`}
    <button class="row-main" data-act="task-edit" data-id="${t.id}"><div class="row-t">${esc(t.title)}</div><div class="row-m">${meta.join(", ")}</div></button>
    ${toVal ? `<div class="acts"><button class="btn" data-act="task-redo" data-id="${t.id}">À refaire</button><button class="btn yes" data-act="task-validate" data-id="${t.id}">Valider</button></div>` : ""}
  </div>`;
}
function proposalRow(e){
  return `<div class="row" style="${cv("both")}">
    <div class="row-main"><div class="row-t">${esc(e.title)}</div><div class="row-m">${couple() ? "" : `de ${esc(P(e.by).name)}, `}${esc(nice(e.date))}${e.start?`, ${esc(e.start)}`:""}${e.note?`, ${esc(e.note)}`:""}</div></div>
    <div class="acts"><button class="btn" data-act="deux-no" data-id="${e.id}">Refuser</button><button class="btn yes" data-act="deux-yes" data-id="${e.id}">Accepter</button></div></div>`;
}

function vFrigo(){
  const me = S.me, t = today(), pn = pName();
  const recus = notesForMe().sort((a,b) => b.createdAt - a.createdAt);
  const envoyes = S.reminders.filter(r => r.from === me && r.to !== me).sort((a,b) => b.createdAt - a.createdAt);
  const list = S.noteView === "recus" ? recus : envoyes;
  const notes = list.map(r => {
    const mine = S.noteView === "recus";
    const meta = mine ? (r.from === me ? "note à moi-même" : `de ${esc(P(r.from).name)}`) : `pour ${esc(P(r.to).name)}, ${r.done ? "c'est fait" : "pas encore fait"}`;
    return `<article class="note ${r.done?"done":""}" style="--c:${hex(r.from)}"><span class="magnet"></span>
      <p class="note-text">${esc(r.text)}</p>
      <p class="note-meta">${meta}${r.due ? `, ${esc(nice(r.due))}` : ""}</p>
      ${mine ? `<button class="note-btn" data-act="rem-done" data-id="${r.id}">C'est fait</button>` : `<button class="note-btn" data-act="rem-del" data-id="${r.id}">Retirer</button>`}
    </article>`;
  }).join("");
  const rows = [];
  toAnswer().forEach(e => rows.push(proposalRow(e)));
  toValidate().forEach(x => rows.push(taskRow(x)));
  allEvents().filter(e => e.date === t && evVisible(e) && !(e.kind === "couple" && e.status === "proposed" && e.by !== me)).sort((a,b) => evKey(a).localeCompare(evKey(b))).forEach(e => rows.push(evRow(e)));
  S.tasks.filter(x => x.status === "todo" && mineT(x) && x.due && x.due <= t).sort((a,b) => a.due.localeCompare(b.due)).forEach(x => rows.push(taskRow(x)));
  return `
    <section>
      <div class="sec-h"><h2>Sur le frigo</h2>
        <div class="chips">
          <button class="chip" data-act="note-view" data-v="recus" aria-pressed="${S.noteView==="recus"}">Pour moi</button>
          <button class="chip" data-act="note-view" data-v="envoyes" aria-pressed="${S.noteView==="envoyes"}">Envoyés</button>
        </div></div>
      ${notes ? `<div class="notes">${notes}</div>` : `<p class="empty">${S.noteView==="recus" ? `Rien sur le frigo. Colle un rappel ${pn ? "à "+esc(pn) : "à quelqu'un"} avec le bouton +.` : `Tu n'as laissé aucun rappel${pn ? " à "+esc(pn) : ""}.`}</p>`}
    </section>
    <section class="sec">
      <div class="sec-h"><h2>Aujourd'hui</h2></div>
      ${rows.length ? `<div class="list">${rows.join("")}</div>` : `<p class="empty">Journée libre : rien au programme, rien à faire.</p>`}
    </section>`;
}

function vAgenda(){
  const y = S.month.getFullYear(), m = S.month.getMonth(), t = today();
  const offset = (new Date(y,m,1).getDay() + 6) % 7, n = new Date(y,m+1,0).getDate();
  const by = {};
  allEvents().filter(evVisible).forEach(e => (by[e.date] = by[e.date] || []).push(e));
  let cells = "LMMJVSD".split("").map(d => `<div class="dow">${d}</div>`).join("") + "<div></div>".repeat(offset);
  for (let d = 1; d <= n; d++) {
    const k = `${y}-${pad(m+1)}-${pad(d)}`, seen = {};
    const dots = (by[k] || []).filter(e => { const key = e.who + (e.status === "proposed" ? "?" : ""); if (seen[key]) return false; seen[key] = 1; return true; })
      .slice(0,3).map(e => `<span class="dot ${e.status==="proposed"?"hollow":""}" style="${cv(e.who)}"></span>`).join("");
    cells += `<button class="day ${k===t?"today":""}" data-act="day" data-d="${k}" aria-pressed="${k===S.day}">${d}<span class="dots">${dots}</span></button>`;
  }
  const evs = (by[S.day] || []).sort((a,b) => evKey(a).localeCompare(evKey(b)));
  const tks = S.tasks.filter(x => x.status !== "done" && x.due === S.day);
  const title = new Date(y,m,1).toLocaleDateString("fr-FR",{month:"long",year:"numeric"});
  return `
    <div class="cal-h"><button class="nav-m" data-act="month" data-n="-1" aria-label="Mois précédent">${I.left}</button>
      <h2>${esc(title)}</h2><button class="nav-m" data-act="month" data-n="1" aria-label="Mois suivant">${I.right}</button></div>
    <div class="grid">${cells}</div>
    <section class="sec">
      <div class="sec-h"><h2 style="text-transform:capitalize">${esc(parse(S.day).toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"}))}</h2>
        <button class="btn yes" data-act="ev-new">Ajouter</button></div>
      ${evs.length || tks.length ? `<div class="list">${evs.map(e => evRow(e)).join("")}${tks.map(taskRow).join("")}</div>` : `<p class="empty">Rien de prévu ce jour-là.</p>`}
    </section>`;
}

function vTaches(){
  const t = today();
  const inWho = x => S.taskWho === "all" || (S.taskWho === "me" ? mineT(x) : (x.assignee === S.taskWho || x.assignee === "both"));
  const inCat = x => S.taskCat === "all" || x.category === S.taskCat;
  const all = S.tasks.filter(inCat);
  const val = all.filter(x => x.status === "pending" && x.doneBy !== S.me);
  const wait = all.filter(x => x.status === "pending" && x.doneBy === S.me);
  const todo = all.filter(x => x.status === "todo" && inWho(x)).sort((a,b) => (a.due || "9").localeCompare(b.due || "9"));
  const done = all.filter(x => x.status === "done" && inWho(x)).sort((a,b) => (b.doneAt||0) - (a.doneAt||0)).slice(0,20);
  const grp = (label, arr) => arr.length ? `<section class="sec"><div class="sec-h"><h2>${label}</h2></div><div class="list">${arr.map(taskRow).join("")}</div></section>` : "";
  const chip = (act, v, cur, label) => `<button class="chip" data-act="${act}" data-v="${v}" aria-pressed="${v===cur}">${label}</button>`;
  return `
    <div class="chips">${chip("task-who","me",S.taskWho,"Moi")}${others().map(k => chip("task-who",k,S.taskWho,esc(P(k).name))).join("")}${chip("task-who","all",S.taskWho,"Tout")}</div>
    <div class="chips" style="margin-top:8px">${chip("task-cat","all",S.taskCat,"Toutes")}${Object.keys(CATS).map(c => chip("task-cat",c,S.taskCat,CATS[c])).join("")}</div>
    ${grp("À valider", val)}
    ${grp("En retard", todo.filter(x => x.due && x.due < t))}
    ${grp("Aujourd'hui", todo.filter(x => x.due === t))}
    ${grp("À venir", todo.filter(x => x.due && x.due > t))}
    ${grp("Sans date", todo.filter(x => !x.due))}
    ${grp("En attente de validation", wait)}
    ${!val.length && !todo.length && !wait.length ? `<p class="empty" style="margin-top:20px">Aucune tâche ici. Ajoutes-en une avec le bouton +.</p>` : ""}
    ${done.length ? `<section class="sec"><button class="link" data-act="done-toggle">${S.showDone ? "Masquer les tâches terminées" : `Voir les tâches terminées (${done.length})`}</button>
      ${S.showDone ? `<div class="list" style="margin-top:10px">${done.map(taskRow).join("")}</div>` : ""}</section>` : ""}`;
}

function vDeux(){
  const t = today(), o = esc(pName() || "ta moitié");
  const h = couple()
    ? {btn:"Proposer un moment à deux", ans:`${o} te propose`, mine:`En attente de ${o}`, no:`Pas possible pour ${o}`, empty:`Aucun moment à deux de prévu. Propose une date, ${o} n'a plus qu'à accepter.`}
    : {btn:"Proposer un moment en famille", ans:"On te propose", mine:"En attente de réponse", no:"Pas possible", empty:"Aucun moment en famille de prévu. Propose une date, les autres n'ont plus qu'à accepter."};
  const c = S.events.filter(e => e.kind === "couple");
  const mineP = c.filter(e => e.status === "proposed" && e.by === S.me);
  const next = c.filter(e => e.status === "accepted" && e.date >= t).sort((a,b) => (a.date+evKey(a)).localeCompare(b.date+evKey(b)));
  const no = c.filter(e => e.status === "declined" && e.by === S.me);
  const ans = toAnswer();
  return `
    <button class="btn big duo-bg" style="${cv("both")}" data-act="deux-new">${h.btn}</button>
    ${ans.length ? `<section class="sec"><div class="sec-h"><h2>${h.ans}</h2></div><div class="list">${ans.map(proposalRow).join("")}</div></section>` : ""}
    ${mineP.length ? `<section class="sec"><div class="sec-h"><h2>${h.mine}</h2></div><div class="list">${mineP.map(e => evRow(e,true)).join("")}</div></section>` : ""}
    <section class="sec"><div class="sec-h"><h2>Prévus</h2></div>
      ${next.length ? `<div class="list">${next.map(e => evRow(e,true)).join("")}</div>` : `<p class="empty">${h.empty}</p>`}</section>
    ${no.length ? `<section class="sec"><div class="sec-h"><h2>${h.no}</h2></div><div class="list">${no.map(e => evRow(e,true)).join("")}</div><p class="sub" style="margin-top:8px">Touche un moment pour proposer une autre date.</p></section>` : ""}`;
}

/* ---------- panneaux ---------- */
function seg(group, opts, cur){
  return `<div class="seg">${opts.map(o => `<button type="button" class="seg-b" data-seg="${group}" data-val="${o[0]}" aria-pressed="${o[0]===cur}" ${o[2]?`style="${o[2]};--on:#fff"`:""}>${o[1]}</button>`).join("")}</div>`;
}
const segVal = g => { const el = document.querySelector(`[data-seg="${g}"][aria-pressed="true"]`); return el ? el.dataset.val : null; };
const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ""; };
const whoOpts = withBoth => { const a = [[S.me,"Moi",cv(S.me)]].concat(others().map(k => [k, esc(P(k).name), cv(k)])); if (withBoth) a.push(["both",ALL(),cv("both")]); return a; };
function sheet(title, body){
  $("#sheet").innerHTML = `<div class="veil" data-act="veil"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <div class="sheet-h"><h2>${title}</h2><button class="x" data-act="close" aria-label="Fermer">${I.x}</button></div>${body}</div></div>`;
}
function closeSheet(){ $("#sheet").innerHTML = ""; S.edit = null; }
function bad(id){ const el = document.getElementById(id); if (el) { el.classList.add("bad"); el.focus(); } }
let toastT;
function toast(msg){ $("#toast").innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT = setTimeout(() => $("#toast").innerHTML = "", 2600); }
function guard(){ if (S.readOnly) { toast("Lecture seule : tu ne peux pas modifier."); return false; } return true; }
const delBtn = act => `<p style="text-align:center;margin-top:14px"><button class="link danger" data-act="${act}">Supprimer</button></p>`;

function fReminder(){
  const os = others();
  sheet("Nouveau rappel", `
    <div class="f"><span>Pour qui ?</span>${seg("to",os.map(k => [k,esc(P(k).name),cv(k)]).concat([[S.me,"Moi",cv(S.me)]]),os[0] || S.me)}</div>
    <label class="f"><span>Le rappel</span><textarea class="in" id="f-text" rows="3" maxlength="140" placeholder="Passer prendre le pain"></textarea></label>
    <label class="f"><span>Pour quand ? (facultatif)</span><input class="in" type="date" id="f-date"></label>
    <button class="btn yes big" data-act="rem-save">Coller sur le frigo</button>`);
}
function fEvent(e){
  S.edit = e || null; const x = e || {date:S.day, who:S.me, allDay:false, start:"", end:"", title:""};
  sheet(e ? "Modifier l'événement" : "Nouvel événement", `
    <label class="f"><span>Quoi ?</span><input class="in" id="f-title" maxlength="80" value="${esc(x.title)}" placeholder="Dentiste, padel, dîner chez les parents"></label>
    <div class="f"><span>Dans le programme de</span>${seg("who",whoOpts(true),x.who)}</div>
    <label class="f"><span>Date</span><input class="in" type="date" id="f-date" value="${esc(x.date)}"></label>
    <label class="check f" style="flex-direction:row"><input type="checkbox" id="f-allday" ${x.allDay?"checked":""}>Toute la journée</label>
    <div class="two" id="f-times" ${x.allDay?"hidden":""}>
      <label class="f"><span>Début</span><input class="in" type="time" id="f-start" value="${esc(x.start||"")}"></label>
      <label class="f"><span>Fin</span><input class="in" type="time" id="f-end" value="${esc(x.end||"")}"></label></div>
    <button class="btn yes big" data-act="ev-save">${e ? "Enregistrer" : "Ajouter à l'agenda"}</button>${e ? delBtn("ev-del") : ""}`);
}
function fDeux(e){
  S.edit = e || null; const x = e || {date:S.tab==="agenda"?S.day:addDays(today(),1), start:"", title:"", note:""};
  const pn = pName(), propose = pn ? `Proposer à ${esc(pn)}` : couple() ? "Proposer" : "Proposer à tout le monde";
  sheet(e ? (couple() ? "Moment à deux" : "Moment en famille") : (couple() ? "Proposer un moment à deux" : "Proposer un moment en famille"), `
    <label class="f"><span>Quoi ?</span><input class="in" id="f-title" maxlength="80" value="${esc(x.title)}" placeholder="Resto, ciné, balade sur la corniche"></label>
    <div class="two">
      <label class="f"><span>Date</span><input class="in" type="date" id="f-date" value="${esc(x.date)}"></label>
      <label class="f"><span>Heure</span><input class="in" type="time" id="f-start" value="${esc(x.start||"")}"></label></div>
    <label class="f"><span>Un détail ? (facultatif)</span><input class="in" id="f-note" maxlength="80" value="${esc(x.note||"")}" placeholder="Je réserve"></label>
    <button class="btn big duo-bg" style="${cv("both")}" data-act="deux-save">${!e ? propose : e.status==="declined" ? "Proposer à nouveau" : "Enregistrer"}</button>
    ${e ? delBtn("ev-del") : ""}`);
}
function fTask(t){
  S.edit = t || null; const x = t || {title:"", assignee:S.me, category:"maison", due:"", recurrence:"none", needsValidation:false};
  sheet(t ? "Modifier la tâche" : "Nouvelle tâche", `
    <label class="f"><span>À faire</span><input class="in" id="f-title" maxlength="100" value="${esc(x.title)}" placeholder="Sortir les poubelles"></label>
    <div class="f"><span>Pour qui ?</span>${seg("who",whoOpts(true),x.assignee)}</div>
    <div class="f"><span>Catégorie</span>${seg("cat",Object.keys(CATS).map(c => [c,CATS[c]]),x.category)}</div>
    <label class="f"><span>Échéance (facultatif)</span><input class="in" type="date" id="f-date" value="${esc(x.due||"")}"></label>
    <div class="f"><span>Répétition</span>${seg("rec",Object.keys(RECS).map(r => [r,RECS[r]]),x.recurrence||"none")}</div>
    <label class="check f" style="flex-direction:row"><input type="checkbox" id="f-val" ${x.needsValidation?"checked":""}>À faire valider par ${couple() ? "l'autre" : "un autre membre"}</label>
    <button class="btn yes big" data-act="task-save">${t ? "Enregistrer" : "Ajouter la tâche"}</button>${t ? delBtn("task-del") : ""}`);
}
function fSettings(){
  const taken = others().map(k => P(k).color);
  const room = CAP[S.space.kind] - ids().length - S.pending.length;
  sheet("Réglages", `
    <label class="f"><span>Ton prénom</span><input class="in" id="g-n" maxlength="20" value="${esc(P(S.me).name)}"></label>
    <div class="f"><span>Ta couleur</span>${swatches("g-c", P(S.me).color, taken)}</div>
    <button class="btn yes big" data-act="settings-save">Enregistrer</button>
    <section class="sec"><div class="sec-h"><h2>Google Agenda</h2></div>
      ${S.gcalMine ? `<div class="list"><div class="row" style="${cv(S.me)}"><div class="row-main"><div class="row-t">Ton Google Agenda est relié</div>
        <div class="row-m">${S.gcalStatus[S.me] === false ? "Lecture impossible : vérifie l'adresse, ou retire-la et colle-la à nouveau" : "Tes événements apparaissent dans l'agenda, avec ta couleur"}</div></div>
        <div class="acts"><button class="btn" data-act="gcal-off">Retirer</button></div></div></div>` : `
      <p class="sub" style="margin-bottom:10px">Colle l'adresse secrète iCal de ton Google Agenda : tes événements s'afficheront dans l'agenda, avec ta couleur. Personne d'autre ne verra cette adresse.</p>
      <label class="f"><span>Adresse secrète au format iCal</span><input class="in" id="g-ics" type="url" autocapitalize="none" autocomplete="off" placeholder="https://calendar.google.com/calendar/ical/…"></label>
      <button class="btn big" data-act="gcal-save">Relier mon Google Agenda</button>
      <p class="sub" style="margin-top:8px;font-size:.85rem">Où la trouver : sur calendar.google.com, Paramètres, ton agenda dans la liste de gauche, section « Intégrer l'agenda », « Adresse secrète au format iCal ».</p>`}
    </section>
    <section class="sec"><div class="sec-h"><h2>${couple() ? "Votre couple" : "Votre famille"}</h2></div>
      <div class="list">${ids().map(k => `<div class="row" style="${cv(k)}"><div class="row-main"><div class="row-t">${esc(P(k).name)}${k===S.me ? " (toi)" : ""}</div></div></div>`).join("")}
      ${S.pending.map(e => `<div class="row" style="--c:var(--line);--c2:var(--line)"><div class="row-main"><div class="row-t">${esc(e)}</div><div class="row-m">invitation en attente</div></div>
        <div class="acts"><button class="btn" data-act="invite-share" data-email="${esc(e)}">Envoyer le lien</button><button class="btn" data-act="invite-cancel" data-email="${esc(e)}">Annuler</button></div></div>`).join("")}</div>
      ${room > 0 ? `<button class="btn big" style="margin-top:10px" data-act="invite">Inviter quelqu'un</button>` : ""}
    </section>
    <p style="text-align:center;margin-top:18px"><button class="link" data-act="logout">Se déconnecter</button></p>`);
}
function fInvite(sent){
  sheet("Inviter", sent ? `
    <p style="margin-bottom:10px">C'est noté : seule l'adresse <b>${esc(sent)}</b> pourra rejoindre votre espace.</p>
    <p class="sub" style="margin-bottom:16px">Envoie-lui le lien de l'appli. Il suffit de créer un compte avec cette adresse et de confirmer l'e-mail reçu pour arriver chez vous.</p>
    <button class="btn yes big" data-act="invite-share" data-email="${esc(sent)}">Envoyer le lien</button>
    <p style="text-align:center;margin-top:14px"><button class="link" data-act="close">Plus tard</button></p>` : `
    <p class="sub" style="margin-bottom:14px">Tape l'adresse e-mail de ${couple() ? "ta moitié" : "la personne"}. Seule cette adresse pourra rejoindre votre espace.</p>
    <label class="f"><span>Son e-mail</span><input class="in" id="i-email" type="email" autocomplete="off" autocapitalize="none" inputmode="email"></label>
    <button class="btn yes big" data-act="invite-send">Inviter</button>`);
}
function fAdd(){
  const pn = pName() ? esc(pName()) : null, cp = couple();
  sheet("Ajouter", `<div class="menu">
    <button data-act="rem-new">Un rappel<small>Une note collée sur le frigo ${pn ? "de "+pn : "de quelqu'un"}</small></button>
    <button data-act="ev-new">Un événement<small>${cp ? "Dans ton programme ou le sien" : "Dans ton programme ou celui d'un autre"}</small></button>
    <button data-act="deux-new">${cp ? "Un moment à deux" : "Un moment en famille"}<small>${cp ? `Tu proposes, ${pn || "ta moitié"} accepte` : "Tu proposes, les autres acceptent"}</small></button>
    <button data-act="task-new">Une tâche<small>Maison, perso ou couple</small></button></div>`);
}

/* ---------- actions ---------- */
const find = (c,id) => S[c].find(x => x.id === id);
async function completeTask(t){
  const x = Object.assign({}, t);
  if (x.recurrence && x.recurrence !== "none") { x.due = nextDue(x.due, x.recurrence); x.status = "todo"; x.lastDoneAt = Date.now(); toast(`Fait. Prochaine fois : ${nice(x.due)}`); }
  else { x.status = "done"; x.doneAt = Date.now(); }
  x.doneBy = x.status === "done" ? (x.doneBy || S.me) : null;
  await store.put("tasks", x);
}
const A = {
  tab(d){ S.tab = d.tab; render(); window.scrollTo(0,0); },
  add(){ if (guard()) fAdd(); },
  close(){ closeSheet(); },
  async login(){
    const email = val("l-email"), pw = document.getElementById("l-pw").value;
    if (!email) return bad("l-email"); if (!pw) return bad("l-pw");
    const r = await sb.auth.signInWithPassword({email, password:pw});
    if (r.error) toast(r.error.code === "email_not_confirmed" || /not confirmed/i.test(r.error.message)
      ? "Confirme d'abord ton e-mail avec le lien reçu, puis reconnecte-toi."
      : "Connexion refusée : vérifie l'e-mail et le mot de passe.");
  },
  async signup(){
    const email = val("l-email"), pw = document.getElementById("l-pw").value;
    if (!email) return bad("l-email");
    if (pw.length < 8) { bad("l-pw"); return toast("Choisis un mot de passe d'au moins 8 caractères."); }
    const r = await sb.auth.signUp({email, password:pw, options:{emailRedirectTo:APP_URL}});
    if (r.error) toast("Création impossible : " + r.error.message);
    else if (!r.data.session) toast("Compte créé. Confirme ton e-mail, puis connecte-toi.");
  },
  async logout(){ closeSheet(); await sb.auth.signOut(); },
  async settings(){ await Promise.all([loadPending(), loadGcalMine()]); fSettings(); },
  async "gcal-save"(){
    const url = val("g-ics");
    if (!url.startsWith(GCAL_PREFIX)) { bad("g-ics"); return toast("Ce n'est pas une adresse iCal Google : elle commence par https://calendar.google.com/calendar/ical/"); }
    const r = await sb.from("calendar_feeds").upsert({user_id:S.uid, url, updated_at:new Date().toISOString()});
    if (r.error) return toast("Ça n'a pas marché. Vérifie ta connexion.");
    S.gcalMine = true; toast("Google Agenda relié");
    await loadGcal(); fSettings();
  },
  async "gcal-off"(){
    const r = await sb.from("calendar_feeds").delete().eq("user_id", S.uid);
    if (r.error) return toast("Ça n'a pas marché. Vérifie ta connexion.");
    S.gcalMine = false; S.gcal = S.gcal.filter(g => g.who !== S.me); render(); fSettings(); toast("Google Agenda retiré");
  },
  "note-view"(d){ S.noteView = d.v; render(); },
  "task-who"(d){ S.taskWho = d.v; render(); },
  "task-cat"(d){ S.taskCat = d.v; render(); },
  "done-toggle"(){ S.showDone = !S.showDone; render(); },
  day(d){ S.day = d.d; render(); },
  month(d){ S.month = new Date(S.month.getFullYear(), S.month.getMonth() + Number(d.n), 1); render(); },

  /* espace */
  "want-create"(){ S.wantCreate = true; render(); },
  "see-invites"(){ S.wantCreate = false; render(); },
  async create(d){
    const r = await sb.rpc("create_space", {p_kind:d.kind});
    if (r.error) return toast("Création impossible. Vérifie ta connexion.");
    S.wantCreate = false; await loadAll(); live();
  },
  async join(d){
    const r = await sb.rpc("accept_invite", {sid:d.sid});
    if (r.error) return toast("Impossible de rejoindre. Vérifie ta connexion.");
    if (r.data === "plein") toast("Cet espace est déjà complet.");
    else if (r.data === "introuvable") toast("Cette invitation n'existe plus.");
    await loadAll(); live();
  },
  async "profile-save"(){
    const name = val("s-n1"), color = segVal("s-c1"); if (!name) return bad("s-n1");
    if (others().some(k => P(k).color === color)) return toast("Cette couleur est déjà prise.");
    if (await store.put("people", {id:S.uid, name, color, joinedAt:Date.now()}) && !others().length) fInvite();
  },
  async "settings-save"(){
    if (!guard()) return;
    const name = val("g-n"); if (!name) return bad("g-n");
    const color = segVal("g-c") || P(S.me).color;
    if (others().some(k => P(k).color === color)) return toast("Cette couleur est déjà prise.");
    if (await store.put("people", Object.assign({}, P(S.me), {id:S.me, name, color}))) { closeSheet(); toast("Enregistré"); }
  },
  invite(){ fInvite(); },
  async "invite-send"(){
    const email = val("i-email").toLowerCase(); if (!email) return bad("i-email");
    const r = await sb.rpc("invite", {p_email:email});
    if (r.error) return toast("Invitation impossible. Vérifie ta connexion.");
    if (r.data !== "ok") {
      if (r.data === "invalide") bad("i-email");
      return toast({invalide:"Cette adresse e-mail n'a pas l'air valide.", plein:couple() ? "Votre espace de couple est déjà complet." : "Votre espace est complet (six personnes).", deja_membre:"Cette personne fait déjà partie de l'espace."}[r.data] || "Invitation impossible.");
    }
    await loadPending(); render(); fInvite(email);
  },
  async "invite-cancel"(d){
    const r = await sb.from("invites").delete().eq("space_id", S.space.id).eq("email", d.email);
    if (r.error) return toast("Ça n'a pas marché. Vérifie ta connexion.");
    await loadPending(); render(); fSettings();
  },
  async "invite-share"(d){
    const text = `Rejoins-moi sur Chez nous : crée ton compte avec l'adresse ${d.email}.`;
    if (navigator.share) {
      try { await navigator.share({title:"Chez nous", text, url:APP_URL}); return; }
      catch(e){ if (e && e.name === "AbortError") return; }
    }
    try { await navigator.clipboard.writeText(text + " " + APP_URL); toast("Lien copié : colle-le dans un message."); }
    catch(e){ toast(APP_URL); }
  },

  "rem-new"(){ fReminder(); },
  async "rem-save"(){
    const text = val("f-text"); if (!text) return bad("f-text");
    const to = segVal("to");
    if (await store.put("reminders",{from:S.me,to,text,due:val("f-date")||null,createdAt:Date.now(),done:false})) {
      closeSheet(); S.tab = "frigo"; S.noteView = to === S.me ? "recus" : "envoyes"; render(); toast("Collé sur le frigo");
    }
  },
  async "rem-done"(d){ if (!guard()) return; const r = find("reminders", d.id); if (r) await store.put("reminders", Object.assign({}, r, {done:true, doneAt:Date.now()})); },
  async "rem-del"(d){ if (guard()) await store.del("reminders", d.id); },

  "ev-new"(){ if (guard()) fEvent(null); },
  "ev-edit"(d){ const e = find("events", d.id); if (e) fEvent(e); },
  async "ev-save"(){
    if (!guard()) return;
    const title = val("f-title"), date = val("f-date"); if (!title) return bad("f-title"); if (!date) return bad("f-date");
    const allDay = document.getElementById("f-allday").checked;
    const e = Object.assign({createdAt:Date.now(), by:S.me}, S.edit || {}, {kind:"event", title, date, allDay, start:allDay?null:(val("f-start")||null), end:allDay?null:(val("f-end")||null), who:segVal("who")});
    if (await store.put("events", e)) { closeSheet(); S.day = date; S.month = new Date(parse(date).getFullYear(), parse(date).getMonth(), 1); render(); toast("Enregistré dans l'agenda"); }
  },
  async "ev-del"(){ if (!guard() || !S.edit) return; if (await store.del("events", S.edit.id)) { closeSheet(); toast("Supprimé"); } },

  "deux-new"(){ if (guard()) fDeux(null); },
  "deux-edit"(d){ const e = find("events", d.id); if (e) fDeux(e); },
  async "deux-save"(){
    if (!guard()) return;
    const title = val("f-title"), date = val("f-date"); if (!title) return bad("f-title"); if (!date) return bad("f-date");
    const old = S.edit, start = val("f-start") || null;
    const changed = !old || old.date !== date || (old.start||null) !== start || old.status === "declined";
    const e = Object.assign({createdAt:Date.now()}, old || {}, {kind:"couple", who:"both", allDay:false, title, date, start, end:null, note:val("f-note")||null});
    if (changed) { e.status = "proposed"; e.by = S.me; }
    if (await store.put("events", e)) { closeSheet(); toast(changed ? (pName() ? `Proposé à ${pName()}` : "Proposé") : "Enregistré"); }
  },
  async "deux-yes"(d){ if (!guard()) return; const e = find("events", d.id); if (e && await store.put("events", Object.assign({}, e, {status:"accepted"}))) toast("C'est noté dans l'agenda"); },
  async "deux-no"(d){ if (!guard()) return; const e = find("events", d.id); if (e) await store.put("events", Object.assign({}, e, {status:"declined"})); },

  "task-new"(){ if (guard()) fTask(null); },
  "task-edit"(d){ const t = find("tasks", d.id); if (t) fTask(t); },
  async "task-save"(){
    if (!guard()) return;
    const title = val("f-title"); if (!title) return bad("f-title");
    const t = Object.assign({createdAt:Date.now(), by:S.me, status:"todo"}, S.edit || {}, {title, assignee:segVal("who"), category:segVal("cat"), due:val("f-date")||null, recurrence:segVal("rec"), needsValidation:document.getElementById("f-val").checked});
    if (await store.put("tasks", t)) { closeSheet(); toast("Enregistré"); }
  },
  async "task-del"(){ if (!guard() || !S.edit) return; if (await store.del("tasks", S.edit.id)) { closeSheet(); toast("Supprimée"); } },
  async "task-tick"(d){
    if (!guard()) return; const t = find("tasks", d.id); if (!t) return;
    if (t.status === "done" || t.status === "pending") return store.put("tasks", Object.assign({}, t, {status:"todo", doneBy:null, doneAt:null}));
    if (t.needsValidation) { await store.put("tasks", Object.assign({}, t, {status:"pending", doneBy:S.me, doneAt:Date.now()})); toast(pName() ? `Envoyé à ${pName()} pour validation` : "Envoyé pour validation"); }
    else await completeTask(t);
  },
  async "task-validate"(d){ if (!guard()) return; const t = find("tasks", d.id); if (t) await completeTask(t); },
  async "task-redo"(d){ if (!guard()) return; const t = find("tasks", d.id); if (t) await store.put("tasks", Object.assign({}, t, {status:"todo", doneBy:null, doneAt:null})); }
};

document.addEventListener("click", e => {
  const s = e.target.closest("[data-seg]");
  if (s) { if (s.disabled) return; document.querySelectorAll(`[data-seg="${s.dataset.seg}"]`).forEach(b => b.setAttribute("aria-pressed", b === s ? "true" : "false")); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  if (el.dataset.act === "veil") { if (e.target === el) closeSheet(); return; }
  const fn = A[el.dataset.act]; if (fn) fn(el.dataset, el);
});
document.addEventListener("change", e => { if (e.target.id === "f-allday") { const t = document.getElementById("f-times"); if (t) t.hidden = e.target.checked; } });
document.addEventListener("input", e => { if (e.target.classList && e.target.classList.contains("bad")) e.target.classList.remove("bad"); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") closeSheet();
  if (e.key === "Enter" && (e.target.id === "l-email" || e.target.id === "l-pw")) A.login();
  if (e.key === "Enter" && e.target.id === "i-email") A["invite-send"]();
});

store.init();
})();
</script>
</body>
</html>
